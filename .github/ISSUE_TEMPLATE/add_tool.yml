name: "➕ Add a Tool"
description: "Suggest an open-source tool to add to the dataset (must meet inclusion criteria)"
title: "[ADD] <tool name>"
labels: ["new-tool", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📌 Tool Submission Guidelines
        Before submitting, please ensure the tool meets our **Inclusion Criteria**:
        - Minimum **100+ GitHub stars**
        - Actively maintained (commits/releases within the past 12 months)
        - Legitimate OSI-approved open source license

  - type: input
    id: name
    attributes:
      label: Tool Name
      placeholder: "e.g. Plausible Analytics"
    validations:
      required: true

  - type: input
    id: github_url
    attributes:
      label: GitHub Repository URL
      placeholder: "https://github.com/plausible/analytics"
    validations:
      required: true

  - type: input
    id: website_url
    attributes:
      label: Official Website URL (optional)
      placeholder: "https://plausible.io"

  - type: input
    id: stars
    attributes:
      label: Current GitHub Star Count
      placeholder: "e.g. 18500 (Must be at least 100+)"
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: Open Source License (SPDX identifier)
      placeholder: "e.g. AGPL-3.0, MIT, Apache-2.0"
    validations:
      required: true

  - type: dropdown
    id: pricing_type
    attributes:
      label: Pricing Type
      options:
        - Free
        - Freemium
        - Paid
    validations:
      required: true

  - type: checkboxes
    id: self_hosted
    attributes:
      label: Self-hostable?
      options:
        - label: "Yes, this tool can be self-hosted"

  - type: textarea
    id: description
    attributes:
      label: One-line Description
      placeholder: "Privacy-friendly Google Analytics alternative"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: The tool has at least 100+ GitHub stars
          required: true
        - label: The GitHub repo is active (commits in the last 12 months)
          required: true
        - label: The tool has a recognized, OSI-approved open source license
          required: true
        - label: I checked that this tool is not already in the dataset
          required: true
